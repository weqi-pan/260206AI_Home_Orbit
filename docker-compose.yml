services:
  mysql:
    image: mysql:8.4
    container_name: ai-customer-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: customer_service
      MYSQL_USER: customer_service
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # Wait until the init SQL truly finished (app database exists).
      # `mysqladmin ping` also succeeds on mysql:8's temporary init server,
      # which once let migrations run mid-boot and die on a dropped connection.
      test: ["CMD-SHELL", "mysql -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SHOW DATABASES LIKE \"customer_service\"' --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-customer-service-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-customer-service-backend
    environment:
      DATABASE_URL: mysql+pymysql://customer_service:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/customer_service
      REDIS_URL: redis://redis:6379/0
      APP_MODE: production
      LLM_CREDENTIAL_MASTER_KEY: ${LLM_CREDENTIAL_MASTER_KEY:?LLM_CREDENTIAL_MASTER_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required}
      DEMO_INITIAL_PASSWORD: ${DEMO_INITIAL_PASSWORD:?DEMO_INITIAL_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-data:/app/backend/data
    restart: unless-stopped
    command: ["sh", "-c", "python -m alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-customer-service-celery-worker
    environment:
      DATABASE_URL: mysql+pymysql://customer_service:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/customer_service
      REDIS_URL: redis://redis:6379/0
      APP_MODE: production
      LLM_CREDENTIAL_MASTER_KEY: ${LLM_CREDENTIAL_MASTER_KEY:?LLM_CREDENTIAL_MASTER_KEY is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend-data:/app/backend/data
    restart: unless-stopped
    command: ["sh", "-c", "celery -A backend.app.tasks.worker_entry worker --loglevel=info --concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.tasks.worker_entry inspect ping -d celery@$$HOSTNAME --timeout=10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-customer-service-celery-beat
    environment:
      DATABASE_URL: mysql+pymysql://customer_service:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/customer_service
      REDIS_URL: redis://redis:6379/0
      APP_MODE: production
      LLM_CREDENTIAL_MASTER_KEY: ${LLM_CREDENTIAL_MASTER_KEY:?LLM_CREDENTIAL_MASTER_KEY is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend-data:/app/backend/data
    restart: unless-stopped
    command: ["sh", "-c", "celery -A backend.app.tasks.worker_entry beat --loglevel=info"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('redis', 6379), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-customer-service-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  backend-data:
